name: release

# Every merge to main releases a version: patch by default, minor for feat:, major for breaking changes.
# Rules live in .releaserc.json.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and GitHub releases; nothing is pushed to a branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26" # semantic-release 26 needs >= 26.13
      - name: Install pinned release tooling (lockfile, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/release
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/release/node_modules/.bin/semantic-release
