name: main-audit

# ADVISORY repos only (private on GitHub Free): nothing on GitHub stops a direct push or an
# unapproved merge there, so this job finds them afterwards and opens a needs-captain issue.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  audit:
    name: main-audit
    runs-on: ubuntu-latest
    steps:
      - name: Every commit on main arrived through a PR approved by someone other than its author
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          since=$(date -u -d '3 days ago' +%FT%TZ)
          for sha in $(gh api "repos/$REPO/commits?sha=$BRANCH&since=$since&per_page=100" --jq '.[].sha'); do
            pr=$(gh api "repos/$REPO/commits/$sha/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty')
            problem=""
            if [ -z "$pr" ]; then
              problem="pushed to $BRANCH without a pull request"
            else
              author=$(gh api "repos/$REPO/pulls/$pr" --jq .user.login)
              approvers=$(gh api "repos/$REPO/pulls/$pr/reviews" --jq "[.[] | select(.state == \"APPROVED\" and .user.login != \"$author\")] | length")
              [ "$approvers" -gt 0 ] || problem="merged in #$pr without approval from anyone but its author"
            fi
            [ -n "$problem" ] || continue
            short=${sha:0:7}
            if [ -z "$(gh issue list -R "$REPO" --state all --search "\"main-audit $short\" in:title" --json number --jq '.[].number')" ]; then
              gh issue create -R "$REPO" --label needs-captain \
                --title "main-audit $short: $problem" \
                --body "Commit $sha on \`$BRANCH\` was $problem. This repo is ADVISORY, so GitHub did not stop it. Check the change, then close this issue."
            fi
          done
